<html>
    <title>Cadastro</title>
    <body>
        <h1>Cadastro</h1>
        <div>
            <h2>Dados pesoais</h2>
        <form action="cadastro.html" method="POST">
        <h4>Nome:</h4>
        <input type="text" maxlength="30" />

        <h4>Endereço </h4>
        <input type="text" maxlength="30" />

        <h4>Cidade </h4>
        <input type="text" maxlength="30" />

        <h4>Estado </h4>
        <select multiple="multiple">
            <option value="1">São Paulo</option>
            <option value="2">Rio de Janeiro</option>
        </select>
        </form>
    </div>

    <div>
        <h2>Dados profissionais</h2>

        <form action="cadastro.html" method="POST">
            <h4>Natureza do cargo:</h4>
            <input type="checkbox" value="1">Gerencia</>
            <input type="checkbox" value="2">Faxineiro</>
            <input type="checkbox" value="3">Banqueiro</>

        <h3>Área de interesse:</h3>
        <input type="radio" value="1">Computação</>
        <input type="radio" value="2">Biologia</>
        <input type="radio" value="3">Fisica</>

        <h5>Mini curriculo:</h5>
        <textarea rows="15" cols="50"></textarea>
        </br>
        <input type=submit value="Enviar" />
        <input type=reset value="Limpar" />


    </div>

    </body>

</html>
